[pytest]
DJANGO_SETTINGS_MODULE = pacemis_inclusive_ed.settings_test
python_files = test_*.py
testpaths = accounts core integrations pacemis_inclusive_ed
addopts = --strict-markers
filterwarnings =
    error::RuntimeWarning:django.db.models.fields
    error::django.utils.deprecation.RemovedInDjango60Warning
markers =
    slow: tests that take noticeably longer than the rest of the suite
