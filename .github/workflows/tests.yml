name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pacemis_inclusive_ed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_NAME: pacemis_inclusive_ed
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -r requirements-dev.txt

      - name: Run test suite with coverage
        run: .venv/bin/python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
